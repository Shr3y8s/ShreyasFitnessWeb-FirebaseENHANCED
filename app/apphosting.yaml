# Firebase App Hosting configuration for the Shreyas Method Fitness Next.js app.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Root directory for the App Hosting backend is `app/`, so this file lives at
# `app/apphosting.yaml`.
#
# Notes:
# - NEXT_PUBLIC_* values are PUBLIC-safe identifiers (Firebase web config and the
#   Stripe *publishable* key). They are compiled into the client bundle at build
#   time, so they use availability: [BUILD, RUNTIME].
# - True secrets (server-side API keys) are NOT placed here as plaintext. They are
#   referenced from Google Cloud Secret Manager via `secret:` and are RUNTIME-only.
#   Create them with:  firebase apphosting:secrets:set <NAME>
# - NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION is injected automatically at build time by
#   next.config.ts from firebase-config.json (region: us-west1), so it is not set here.

runConfig:
  # Set minInstances to 1 before launch if first-request cold-start latency matters
  # (see Phase 2 of the launch plan). Default 0 = scale to zero = lowest cost.
  minInstances: 0
  maxInstances: 100
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  # ---- Public Firebase web config (safe to expose; compiled into the bundle) ----
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyADF9yuram-pvlzjg6kBtdCk7LuK0M65tk"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "shreyfitweb.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "shreyfitweb"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "shreyfitweb.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1076359633281"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1076359633281:web:3687e1675c9e185f0ab080"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-5GBP19SXBW"
    availability:
      - BUILD
      - RUNTIME

  # ---- Canonical app URL (used for redirects / links / emails) ----
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://shrey.fit"
    availability:
      - BUILD
      - RUNTIME

  # ---- Stripe publishable key (PUBLIC). Replace value with the LIVE pk_live_... ----

  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: "pk_live_51Hg4SwBjx3iGODd6mTNbJ8jDzAnTojvjzsyu7xmCtK99ApfDcKfc0nfSFNA8asTU1FwNKaJhMsFozycwHkYu2liy004O3xedCN"
    availability:
      - BUILD
      - RUNTIME

  # ---- PayPal (launch processor). PRODUCTION env in prod (design §7.1). ----
  # NEXT_PUBLIC_PAYPAL_CLIENT_ID is PUBLIC by design (browser SDK loader). The live
  # CLIENT SECRET + WEBHOOK_ID are server-side only and live in Secret Manager
  # (referenced by Cloud Functions, not here). Replace the client id placeholder
  # with the LIVE PayPal app's Client ID before cutover (Phase 5).
  - variable: NEXT_PUBLIC_PAYPAL_ENV
    value: "production"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PAYPAL_CLIENT_ID
    value: "AXaVrTyT7QK5Rk8eEUETRH5oq8ZFBtikcx5au_E8x1RvYdg-mSbOnnYw6qPvyvcOV8KFhDFA0yLiqV_T"
    availability:
      - BUILD
      - RUNTIME

  # ---- reCAPTCHA v3 SITE key (PUBLIC; runs in the browser) ----
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: "6LfvdvkrAAAAAH-3siHTiK8UwVOUJ75TOXLrXaxQ"
    availability:
      - BUILD
      - RUNTIME


  # ---- Server-side secrets (Secret Manager references; RUNTIME only) ----
  # Used by Next.js API routes that run on the App Hosting (Cloud Run) server.
  # Create/populate each before the first rollout:
  #   firebase apphosting:secrets:set GOOGLE_MAPS_API_KEY
  #   firebase apphosting:secrets:set RECAPTCHA_SECRET_KEY
  #   firebase apphosting:secrets:set RESEND_API_KEY
  #
  # NOTE: the app currently reads the Maps key via process.env.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
  # but only inside server-side API routes (/api/autocomplete, /api/place-details).
  # It is exposed here as a RUNTIME secret so the key is NOT inlined into the client bundle.
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: GOOGLE_MAPS_API_KEY
    availability:
      - RUNTIME
  - variable: RECAPTCHA_SECRET_KEY
    secret: RECAPTCHA_SECRET_KEY
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
